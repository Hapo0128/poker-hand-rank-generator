  { name: 'バックドアストレート・3連続だが端(Q-K-Aなど)', kind: 'ストレート', percent: 1.5, bucket: 2, build: buildBackdoorStraight3Edge }
];
const BACKDOOR_BUCKET_LABELS = ['約4%', '3%', '1.5%'];

function generateBackdoorQuestion(){
  const pattern = BACKDOOR_PATTERNS[Math.floor(Math.random() * BACKDOOR_PATTERNS.length)];
  const { hole, board } = pattern.build();
  const correctPercent = pattern.percent;
  const answerIndex = pattern.bucket;
  return {
    question: `フロップ時点でこの状態です。バックドアで${pattern.kind}が完成する確率は、だいたい何%?`,
    scenarioHTML: drawScenarioHTML(hole, board),
    choices: BACKDOOR_BUCKET_LABELS.slice(),
    answerIndex,
    formula: `${pattern.name} → 正確な完成率 ≈ ${correctPercent.toFixed(1)}%(近似のアウツ×4ではなく、ターン・リバー全組み合わせで計算した値) → 目安は「${BACKDOOR_BUCKET_LABELS[answerIndex]}」`,
    isChoice: true,
    hard: false
  };
}

function drawScenarioHTML(hole, board){
  return `<div class="hole-row" style="justify-content:center;">${hole.map(cardHTML).join('')}</div>
    <div class="community" style="justify-content:center;margin-top:4px;">${board.map(cardHTML).join('')}</div>`;
}

function outsQuestionFor(drawIndex, twoCards){
  const draw = DRAW_TYPES[drawIndex];
  const { hole, board, turnCard } = draw.build();
  const outs = draw.outs;
  const answer = twoCards ? outs * 4 : outs * 2;
  const detailPrefix = draw.detail ? `${draw.detail} → ` : '';
  const displayBoard = twoCards ? board : board.concat([turnCard]); // リバーのみの場合はターンまで4枚見せる
  return {
    question: twoCards
      ? `フロップで${draw.name}です。ターン+リバーの2枚を見られる場合、アウツから計算した勝率は何%?`
      : `フロップ+ターンでこの状態です。${draw.name}のまま、残り1枚(リバーのみ)を見る場合、アウツから計算した勝率は何%?`,
    answer,
    formula: twoCards
      ? `${detailPrefix}${draw.name}(アウツ${outs}枚) → 勝率(ルールオブ4) = ${outs}×4 = ${answer}%`
      : `${detailPrefix}${draw.name}(アウツ${outs}枚) → 勝率(ルールオブ2) = ${outs}×2 = ${answer}%`,
    scenarioHTML: drawScenarioHTML(hole, displayBoard),
    hard: false
  };
}

function generateRequiredEquityQuestion(){
  return equityQuestionForSize(BET_SIZE_CHOICES[Math.floor(Math.random() * BET_SIZE_CHOICES.length)]);
}
function generateMDFQuestion(){
  return mdfQuestionForSize(BET_SIZE_CHOICES[Math.floor(Math.random() * BET_SIZE_CHOICES.length)]);
}
function generateBluffSuccessQuestion(){
  return bluffQuestionForSize(BET_SIZE_CHOICES[Math.floor(Math.random() * BET_SIZE_CHOICES.length)]);
}
function generateOutsEquityQuestion(){
  const drawIndex = Math.floor(Math.random() * DRAW_TYPES.length);
  const twoCards = Math.random() < 0.5;
  return outsQuestionFor(drawIndex, twoCards);
}

/* 「全問題を網羅」モード用: カテゴリごとの全バリエーション一覧(パラメータなし関数の配列) */
function buildFullVariantList(cat){
  if(cat === 'combo') return COMBO_VARIANT_FNS.slice();
  if(cat === 'equity') return BET_SIZE_CHOICES.map(size => () => equityQuestionForSize(size));
  if(cat === 'mdf') return BET_SIZE_CHOICES.map(size => () => mdfQuestionForSize(size));
  if(cat === 'bluff') return BET_SIZE_CHOICES.map(size => () => bluffQuestionForSize(size));
  if(cat === 'outs'){
    const arr = [];
    for(let i = 0; i < DRAW_TYPES.length; i++){
      arr.push(() => outsQuestionFor(i, false));
      arr.push(() => outsQuestionFor(i, true));
    }
    return arr;
  }
  if(cat === 'backdoor') return BACKDOOR_PATTERNS.map(() => generateBackdoorQuestion);
  return [];
}

function generateQuestionForCategory(cat){
  if(cat === 'equity') return generateRequiredEquityQuestion();
  if(cat === 'outs') return generateOutsEquityQuestion();
  if(cat === 'mdf') return generateMDFQuestion();
  if(cat === 'bluff') return generateBluffSuccessQuestion();
  if(cat === 'backdoor') return generateBackdoorQuestion();
  return generateComboQuestion();
}

function randRank(){ return RANK_ORDER[Math.floor(Math.random() * 13)]; }
function randTwoDistinctRanks(){
  const a = randRank();
  let b = randRank();
  while(b === a) b = randRank();
  // 表示上は強い方を先に(RANK_ORDER内でindexが小さい方が強い)
  const ia = RANK_ORDER.indexOf(a), ib = RANK_ORDER.indexOf(b);
  return ia < ib ? [a, b] : [b, a];
}
function randSuitSymbol(){
  const s = SUITS[Math.floor(Math.random() * 4)];
  return SUIT_SYMBOL[s];
}
/* pair/offsuitは重み2、suitedは重み1(易しすぎるため出現頻度を下げる) */
function randHandType(){
  const roll = Math.random() * 5;
  if(roll < 2) return 'pair';
  if(roll < 3) return 'suited';
  return 'offsuit';
}

function comboVariant_basicPair(){
  const r = randRank();
  return { question: `${r}${r}は何コンボ?`, answer: 6, formula: `${r}${r} = 6コンボ` };
}
function comboVariant_basicSuited(){
  const [hi, lo] = randTwoDistinctRanks();
  return { question: `${hi}${lo}s(スーテッド)は何コンボ?`, answer: 4, formula: `${hi}${lo}s = 4コンボ` };
}
function comboVariant_basicOffsuit(){
  const [hi, lo] = randTwoDistinctRanks();
  return { question: `${hi}${lo}o(オフスート)は何コンボ?`, answer: 12, formula: `${hi}${lo}o = 12コンボ` };
}
function comboVariant_blockerPair(){
  const r = randRank();
  const suit = randSuitSymbol();
  return {
    question: `自分が${r}${suit}を1枚持っている時、相手の${r}${r}は何コンボ残っていますか?`,
    answer: 3,
    formula: `6 − 3(1枚ブロック) = 3`
  };
}
function comboVariant_blockerSuited(){
  const [hi, lo] = randTwoDistinctRanks();
  const suit = randSuitSymbol();
  const blockRank = Math.random() < 0.5 ? hi : lo;
  return {
    question: `自分が${blockRank}${suit}を1枚持っている時、相手の${hi}${lo}sは何コンボ残っていますか?`,
    answer: 3,
    formula: `4 − 1(1枚ブロック) = 3`
  };
}
function comboVariant_blockerOffsuit(){
  const [hi, lo] = randTwoDistinctRanks();
  const suit = randSuitSymbol();
  const blockRank = Math.random() < 0.5 ? hi : lo;
  return {
    question: `自分が${blockRank}${suit}を1枚持っている時、相手の${hi}${lo}oは何コンボ残っていますか?`,
    answer: 9,
    formula: `12 − 3(1枚ブロック) = 9`
  };
}
function comboVariant_sum2pairs(){
  const [r1, r2] = randTwoDistinctRanks();
  return { question: `${r1}${r1}と${r2}${r2}を合わせると、合計何コンボ?`, answer: 12, formula: `6 + 6 = 12` };
}
function comboVariant_sum3pairs(){
  let ranks = [];
  while(ranks.length < 3){
    const r = randRank();
    if(!ranks.includes(r)) ranks.push(r);
  }
  return { question: `${ranks[0]}${ranks[0]}・${ranks[1]}${ranks[1]}・${ranks[2]}${ranks[2]}の3種類のペアを合計すると、何コンボ?`, answer: 18, formula: `6 × 3 = 18` };
}
function comboVariant_sumSameRankSO(){
  const [hi, lo] = randTwoDistinctRanks();
  return { question: `「${hi}${lo}s」と「${hi}${lo}o」を合わせると(${hi}${lo}全体)、合計何コンボ?`, answer: 16, formula: `4 + 12 = 16` };
}
function comboVariant_sum2suited(){
  const [a1, a2] = randTwoDistinctRanks();
  const [b1, b2] = randTwoDistinctRanks();
  return { question: `「${a1}${a2}s」と「${b1}${b2}s」を合わせると、合計何コンボ?`, answer: 8, formula: `4 + 4 = 8` };
}

const COMBO_VARIANT_FNS = [
  comboVariant_basicPair, comboVariant_basicSuited, comboVariant_basicOffsuit,
  comboVariant_blockerPair, comboVariant_blockerSuited, comboVariant_blockerOffsuit,
  comboVariant_sum2pairs, comboVariant_sum3pairs, comboVariant_sumSameRankSO, comboVariant_sum2suited
];

function generateComboQuestion(){
  const fn = COMBO_VARIANT_FNS[Math.floor(Math.random() * COMBO_VARIANT_FNS.length)];
  return fn();
}

/* ================== 難問(5連続正解で出現) ================== */
function generateHardComboQuestion(){
  const hType = Math.floor(Math.random() * 4);

  // ①2枚ブロック(ポケットペア持ち)
  if(hType === 0){
    const r = randRank();
    return {
      question: `自分が${r}${r}(ポケットペア)を持っている時、相手の${r}${r}は何コンボ残っていますか?`,
      answer: 1,
      formula: `4枚中2枚使用済み → 残り2枚 → 1コンボ`,
      hard: true
    };
  }

  // ②ボード+ハンドの複合ブロック(オフスート、異なるランクを1枚ずつブロック)
  if(hType === 1){
    const [hi, lo] = randTwoDistinctRanks();
    const s1 = randSuitSymbol();
    let s2 = randSuitSymbol();
    while(s2 === s1) s2 = randSuitSymbol();
    return {
      question: `自分の手に${hi}${s1}、ボードに${lo}${s2}が見えている時、相手の${hi}${lo}o(オフスート)は何コンボ残っていますか?`,
      answer: 7,
      formula: `12 − (3 + 3 − 1[重複]) = 7`,
      hard: true
    };
  }

  // ③レンジ全体の集計(ペアレンジ or スーテッドレンジ、どちらか片方のみ)
  if(hType === 2){
    if(Math.random() < 0.5){
      const pIdx = 3 + Math.floor(Math.random() * 7); // J〜3あたり
      const pairRank = RANK_ORDER[pIdx];
      const pairsCount = 6 * (pIdx + 1);
      return {
        question: `${pairRank}${pairRank}+ は何コンボ?`,
        answer: pairsCount,
        formula: `${pairRank}${pairRank}からAAまで${pIdx + 1}種類 × 6 = ${pairsCount}`,
        hard: true
      };
    }
    const sIdx = 1 + Math.floor(Math.random() * 6); // K〜8あたり
    const suitedLowRank = RANK_ORDER[sIdx];
    const suitedCount = 4 * sIdx;
    return {
      question: `A${suitedLowRank}s+ は何コンボ?`,
      answer: suitedCount,
      formula: `A${suitedLowRank}sからAKsまで${sIdx}種類 × 4 = ${suitedCount}`,
      hard: true
    };
  }

  // ④フラッシュ絡みのブロック
  const n = 1 + Math.floor(Math.random() * 3); // ボードに見えているスート枚数
  const remaining = 13 - n;
  const answer = remaining * (remaining - 1) / 2;
  return {
    question: `ボードに♠が${n}枚見えていて、自分は♠を持っていない時、相手が持てるスーテッドスペード(2枚とも♠)は全体で何コンボありますか?`,
    answer,
    formula: `残り${remaining}枚から2枚選ぶ → ${remaining}×${remaining - 1}÷2 = ${answer}`,
    hard: true
  };
}

function jumpToHard(){
  comboNextHard = true;
  newComboQuestion();
}

function drawFullVariantQuestion(){
  if(comboVariantBag.length === 0){
    let combined = [];
    Array.from(comboEnabledTypes).forEach(cat => {
      combined = combined.concat(buildFullVariantList(cat));
    });
    comboVariantBag = shuffle(combined);
  }
  const fn = comboVariantBag.pop();
  return fn();
}

function newComboQuestion(){
  if(comboNextHard){
    comboQuestionData = generateHardComboQuestion();
    comboNextHard = false;
  } else if(comboFullCoverage){
    comboQuestionData = drawFullVariantQuestion();
  } else {
    const cat = drawComboCategory();
    comboQuestionData = generateQuestionForCategory(cat);
  }
  comboAnswerInput = '';
  comboAnswered = false;
  comboChoiceSelected = null;
  renderComboQuiz();
}

function onNumpadDigit(d){
  if(comboAnswered){ newComboQuestion(); return; }
  if(comboAnswerInput.length >= 3) return;
  comboAnswerInput += d;
  renderComboQuiz();
}
function onNumpadBackspace(){
  if(comboAnswered) return;
  comboAnswerInput = comboAnswerInput.slice(0, -1);
  renderComboQuiz();
}
function onNumpadClear(){
  if(comboAnswered) return;
  comboAnswerInput = '';
  renderComboQuiz();
}
function onNumpadConfirm(){
  if(comboAnswered){ newComboQuestion(); return; }
  if(comboAnswerInput === '') return;
  comboAnswered = true;
  comboScore.total++;
  const userAnswer = parseInt(comboAnswerInput, 10);
  if(userAnswer === comboQuestionData.answer){
    comboScore.correct++;
    comboStreak++;
    if(comboStreak > 0 && comboStreak % 5 === 0) comboNextHard = true;
  } else {
    comboStreak = 0;
  }
  renderComboQuiz();
}

let comboChoiceSelected = null;
function onComboChoiceSelect(idx){
  if(comboAnswered) return;
  comboChoiceSelected = idx;
  comboAnswered = true;
  comboScore.total++;
  if(idx === comboQuestionData.answerIndex){
    comboScore.correct++;
    comboStreak++;
    if(comboStreak > 0 && comboStreak % 5 === 0) comboNextHard = true;
  } else {
    comboStreak = 0;
  }
  renderComboQuiz();
}
function onComboChoiceNext(){
  newComboQuestion();
}

function renderComboQuiz(){
  const hardTag = comboQuestionData.hard ? '【難問】' : '';
  document.getElementById('comboQuestion').textContent = hardTag + comboQuestionData.question;
  document.getElementById('comboScenario').innerHTML = comboQuestionData.scenarioHTML || '';

  const isChoice = !!comboQuestionData.isChoice;
  const displayEl = document.getElementById('comboAnswerDisplay');
  const numpadEl = document.getElementById('comboNumpad');
  const choiceRowEl = document.getElementById('comboChoiceRow');

  if(isChoice){
    displayEl.style.display = 'none';
    numpadEl.style.display = 'none';
    choiceRowEl.style.display = 'grid';
  } else {
    displayEl.style.display = '';
    numpadEl.style.display = '';
    choiceRowEl.style.display = 'none';
  }

  if(!isChoice){
    displayEl.textContent = comboAnswerInput === '' ? '?' : comboAnswerInput;
    displayEl.className = 'combo-answer-display' + (comboAnswerInput === '' ? ' empty' : '');
  }

  const explainEl = document.getElementById('comboExplain');
  if(!comboAnswered){
    explainEl.className = 'combo-explain';
    explainEl.innerHTML = '';
  } else if(isChoice){
    const correct = comboChoiceSelected === comboQuestionData.answerIndex;
    explainEl.className = 'combo-explain ' + (correct ? 'correct' : 'wrong');
    explainEl.innerHTML = `
      <span class="mark">${correct ? '○' : '✕'}</span>
      <span class="msg">${correct ? '正解!' : `残念...正解は${comboQuestionData.choices[comboQuestionData.answerIndex]}`}</span>
      <span class="formula">${comboQuestionData.formula}</span>`;
  } else {
    const correct = parseInt(comboAnswerInput, 10) === comboQuestionData.answer;
    explainEl.className = 'combo-explain ' + (correct ? 'correct' : 'wrong');
    explainEl.innerHTML = `
      <span class="mark">${correct ? '○' : '✕'}</span>
      <span class="msg">${correct ? '正解!' : `残念...正解は${comboQuestionData.answer}`}</span>
      <span class="formula">${comboQuestionData.formula}</span>`;
  }

  if(isChoice){
    choiceRowEl.innerHTML = comboQuestionData.choices.map((label, idx) => {
      let cls = 'combo-choice-btn';
      if(comboAnswered){
        if(idx === comboQuestionData.answerIndex) cls += ' reveal-correct';
        if(idx === comboChoiceSelected && idx !== comboQuestionData.answerIndex) cls += ' picked-wrong';
        if(idx === comboChoiceSelected && idx === comboQuestionData.answerIndex) cls += ' picked-correct';
      }
      return `<button class="${cls}" ${comboAnswered ? 'disabled' : ''} onclick="onComboChoiceSelect(${idx})">${label}</button>`;
    }).join('');
    if(comboAnswered){
      choiceRowEl.innerHTML += `<button class="btn-next single" style="grid-column:span 3;margin-top:4px;" onclick="onComboChoiceNext()">次の問題</button>`;
    }
  } else {
    const digits = ['1','2','3','4','5','6','7','8','9'];
    let html = digits.map(d => `<button class="numpad-btn" onclick="onNumpadDigit('${d}')">${d}</button>`).join('');
    html += `<button class="numpad-btn clear" onclick="onNumpadClear()">C</button>`;
    html += `<button class="numpad-btn" onclick="onNumpadDigit('0')">0</button>`;
    html += `<button class="numpad-btn" onclick="onNumpadBackspace()">⌫</button>`;
    html += `<button class="numpad-btn confirm" style="grid-column:span 3;" onclick="onNumpadConfirm()">${comboAnswered ? '次の問題' : '決定'}</button>`;
    numpadEl.innerHTML = html;
  }

  document.getElementById('comboScoreLabel').textContent = `正解 ${comboScore.correct} / ${comboScore.total} ・ 連続正解 ${comboStreak}`;
}

function usedCardsManual(){
  const used = [];
  manualHole.forEach(c => { if(c) used.push(c); });
  manualBoard.forEach(c => { if(c) used.push(c); });
  return used;
}

/* デッキから1枚タップ → ハンド(2枚)優先、埋まっていればボード(最大5枚)へ */
function onDeckCardTap(rankChar, suit){
  const rVal = LV[rankChar];
  if(usedCardsManual().some(c => c.r === rVal && c.s === suit)) return;
  if(!manualHole[0]){
    manualHole[0] = { r:rVal, s:suit };
  } else if(!manualHole[1]){
    manualHole[1] = { r:rVal, s:suit };
  } else {
    const idx = manualBoard.findIndex(c => !c); // 空いている最初のスロット(途中の穴も優先して埋める)
    if(idx !== -1) manualBoard[idx] = { r:rVal, s:suit };
  }
  renderManual();
}

function onManualHoleCardTap(idx){
  // 片方だけ選び直し。ボードは維持したまま
  manualHole[idx] = null;
  renderManual();
}

function onBoardSlotTap(idx){
  // そのカードだけ選び直し。他のボードカードはそのまま残す
  if(manualBoard[idx]){
    manualBoard[idx] = null;
    renderManual();
  }
}

function undoManualStep(){
  let lastFilledIdx = -1;
  for(let i = 4; i >= 0; i--){
    if(manualBoard[i]){ lastFilledIdx = i; break; }
  }
  if(lastFilledIdx !== -1){
    manualBoard[lastFilledIdx] = null;
  } else if(manualHole[1]){
    manualHole[1] = null;
  } else if(manualHole[0]){
    manualHole[0] = null;
  }
  renderManual();
}

function resetManual(){
  manualHole = [null, null];
  manualBoard = [null, null, null, null, null];
  renderManual();
}

function generateDeckGridHTML(){
  const used = usedCardsManual();
  let html = '';
  SUITS.forEach(s => {
    RANK_ORDER.forEach(r => {
      const rVal = LV[r];
      const isUsed = used.some(c => c.r === rVal && c.s === s);
      html += `<button class="deck-cell" style="background:${SUIT_BG[s]};" ${isUsed ? 'disabled' : `onclick="onDeckCardTap('${r}','${s}')"`}>${r}${SUIT_SYMBOL[s]}</button>`;
    });
  });
  return html;
}

function generateManualCommunityHTML(){
  const nextEmptyIdx = manualBoard.findIndex(c => !c);
  const boardTurn = !!(manualHole[0] && manualHole[1]); // ハンドが両方揃って初めてボードを選ぶ番になる
  let html = '';
  for(let i = 0; i < 5; i++){
    if(manualBoard[i]){
      html += `<div onclick="onBoardSlotTap(${i})" style="cursor:pointer;">${cardHTML(manualBoard[i])}</div>`;
    } else {
      html += emptySlotHTML(boardTurn && i === nextEmptyIdx);
    }
  }
  return html;
}

function generateManualHoleHTML(){
  let html = '<div style="display:flex;gap:8px;">';
  for(let i = 0; i < 2; i++){
    if(manualHole[i]){
      html += `<div onclick="onManualHoleCardTap(${i})" style="cursor:pointer;">${cardHTML(manualHole[i])}</div>`;
    } else {
      const isActive = (i === 0 && !manualHole[0]) || (i === 1 && manualHole[0] && !manualHole[1]);
      html += emptySlotHTML(isActive);
    }
  }
  html += '</div>';
  return html;
}

function renderManual(){
  // ボードは常に5枚分の枠を表示する(ハンド選択中でも点線のまま表示)
  document.getElementById('manualCommunity').innerHTML = generateManualCommunityHTML();
  document.getElementById('manualHoleRow').innerHTML = generateManualHoleHTML();

  const hasAnySelection = !!manualHole[0] || manualBoard.some(c => c);
  const undoBtn = document.getElementById('undoBtn');
  if(undoBtn) undoBtn.disabled = !hasAnySelection;

  const filledCount = manualBoard.filter(c => c).length;
  const labelEl = document.getElementById('manualStageLabel');
  if(!manualHole[0]){
    labelEl.textContent = 'ハンドの1枚目をデッキから選択';
  } else if(!manualHole[1]){
    labelEl.textContent = 'ハンドの2枚目をデッキから選択';
  } else if(filledCount < 3){
    labelEl.textContent = `ボードをデッキから選択(あと${3 - filledCount}枚でフロップ)`;
  } else {
    labelEl.textContent = ['', '', '', 'フロップ', 'ターン', 'リバー'][filledCount];

  const tierEl = document.getElementById('manualTierRow');
  const pyramidEl = document.getElementById('manualPyramidWrap');
  const community = manualBoard.filter(c => c);

  if(manualHole[0] && manualHole[1] && community.length >= 3){
    const evalResult = evaluateBest([...manualHole, ...community]);
    let name = HAND_NAMES[evalResult.rank];
    if(evalResult.rank === 9) name = 'ロイヤルフラッシュ';
    if(isBoardOnly(evalResult, community)) name += ' <span class="board-tag">(ボード)</span>';
    nameEl.innerHTML = name;
    nameEl.className = 'hand-name ' + handClass(evalResult.rank);

    const manualOppRange = getOppRangeCombos(manualPosition, manualPerspective, manualPotType);
    const dist = computeTierDistribution(manualHole, community, manualPosition, manualOppRange);
    const pct = Math.round(dist.heroPercentile * 100);
    tierEl.innerHTML = `<div class="tier-badge tier-${dist.heroTier}"><span class="letter">${dist.heroTier}ランク</span><span class="pct">${tierPctLabel(dist.heroTier, pct)}</span></div>`;

    lastPyramidList = dist.fullList;
  } else {
    nameEl.innerHTML = '';
    nameEl.className = 'hand-name';
